server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  resolver 127.0.0.11 valid=10s;
  set $api_upstream unified-api:8080;

  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = / {
    return 302 /admin/;
  }

  location ^~ /admin/assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location = /admin/index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-store" always;
  }

  location = /down {
    try_files /down/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location /down/assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /down/files/ {
    types {
      application/vnd.android.package-archive apk;
      application/octet-stream hap;
    }
    default_type application/octet-stream;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition "attachment" always;
    limit_except GET { deny all; }
  }

  location /down/ {
    try_files $uri $uri/ /down/index.html;
    add_header Cache-Control "no-store" always;
  }

  location = /say-ring {
    try_files /down/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location = /say-ring/ {
    try_files /down/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  # The iPhone-first Say Ring release has an account-free local companion
  # flow. Keep its public terms separate from the download page and never
  # route these paths to an API or admin application.
  location = /say-ring/privacy {
    try_files /down/say-ring-privacy.html =404;
    add_header Cache-Control "no-store" always;
  }

  location = /say-ring/terms {
    try_files /down/say-ring-terms.html =404;
    add_header Cache-Control "no-store" always;
  }

  location = /global/privacy-policy {
    try_files /down/global/privacy-policy.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
  }

  location = /global/terms {
    try_files /down/global/terms.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
  }

  location = /global/support {
    try_files /down/global/support.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
  }

  location = /global/account-deletion {
    try_files /down/global/account-deletion.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
  }

  location ^~ /global/public-assets/ {
    rewrite ^/global/public-assets/(.*)$ /down/global/public-assets/$1 last;
  }

  location ^~ /down/global/public-assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /saidian-mall/assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location /saidian-mall/ {
    try_files $uri $uri/ /saidian-mall/index.html;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location = /global/saidian-mall {
    return 308 /global/saidian-mall/;
  }

  location /global/saidian-mall/ {
    rewrite ^/global/(.*)$ /$1 last;
    access_log off;
  }

  location / {
    return 302 /admin/;
  }
}
