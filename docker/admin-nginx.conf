server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  resolver 127.0.0.11 valid=10s;
  set $api_upstream unified-api:8080;

  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = / {
    return 302 /admin/;
  }

  location ^~ /admin/assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location = /admin/index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-store" always;
  }

  location = /down {
    try_files /down/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location /down/assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /down/files/ {
    types {
      application/vnd.android.package-archive apk;
      application/octet-stream hap;
    }
    default_type application/octet-stream;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition "attachment" always;
    limit_except GET { deny all; }
  }

  location /down/ {
    try_files $uri $uri/ /down/index.html;
    add_header Cache-Control "no-store" always;
  }

  location = /say-ring {
    try_files /down/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location = /say-ring/ {
    try_files /down/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location ^~ /saidian-mall/assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location /saidian-mall/ {
    try_files $uri $uri/ /saidian-mall/index.html;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location = /global/saidian-mall {
    return 308 /global/saidian-mall/;
  }

  location /global/saidian-mall/ {
    rewrite ^/global/(.*)$ /$1 last;
    access_log off;
  }

  location / {
    return 302 /admin/;
  }
}
