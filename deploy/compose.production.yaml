name: saydianapp-production

services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    cpus: 1.0
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300s
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - wal_archive:/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      private:
        aliases: [saydianapp-postgres]

  redis:
    image: redis:7-alpine
    mem_limit: 128m
    cpus: 0.5
    env_file: .env.production
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"",
      ]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      private:
        aliases: [saydianapp-redis]

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    profiles: ["local-storage"]
    mem_limit: 256m
    cpus: 0.5
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [private]

  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    profiles: ["local-storage"]
    mem_limit: 64m
    cpus: 0.25
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      LOCAL_BACKUP_BUCKET: ${LOCAL_BACKUP_BUCKET:-saydian-app-backups}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}" &&
        mc anonymous set none "local/$${OBJECT_STORAGE_BUCKET}" &&
        mc mb --ignore-existing "local/$${LOCAL_BACKUP_BUCKET}" &&
        mc anonymous set none "local/$${LOCAL_BACKUP_BUCKET}"
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"
    read_only: true
    tmpfs: ["/tmp", "/root/.mc"]
    security_opt: ["no-new-privileges:true"]
    networks: [private]

  api:
    image: ghcr.io/tangwu88/saydianserver-api:${IMAGE_TAG}
    mem_limit: 512m
    cpus: 1.0
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 8080
      PUBLIC_BASE_URL: https://${APP_DOMAIN}
      MAINTENANCE_READ_ONLY: ${MAINTENANCE_READ_ONLY:-true}
      APP_REVISION: ${APP_REVISION:-unversioned}
      ALLOW_TEST_OTP: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./secrets/apple:/run/secrets/apple:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    networks:
      private:
      gateway:
        aliases: [saydianapp-api]

  worker:
    image: ghcr.io/tangwu88/saydianserver-worker:${IMAGE_TAG}
    mem_limit: 384m
    cpus: 0.75
    env_file: .env.production
    environment:
      NODE_ENV: production
      REPORT_WORKER_CONCURRENCY: "1"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    networks: [private]

  admin:
    image: ghcr.io/tangwu88/saydianserver-admin:${IMAGE_TAG}
    mem_limit: 96m
    cpus: 0.25
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    volumes:
      - ./downloads:/usr/share/nginx/html/down/files:ro
    security_opt: ["no-new-privileges:true"]
    networks:
      private:
      gateway:
        aliases: [saydianapp-admin]

  caddy:
    image: caddy:2.8-alpine
    mem_limit: 96m
    cpus: 0.25
    env_file: .env.production
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      admin: { condition: service_started }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [private]

  backup:
    image: restic/restic:0.17.3
    mem_limit: 128m
    cpus: 0.5
    profiles: ["backups"]
    env_file: .env.production
    environment:
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until restic snapshots >/dev/null 2>&1 || restic init; do sleep 10; done;
        while true; do
          restic backup /backups /wal_archive --tag saydian-app &&
          restic forget --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --prune;
          sleep 86400;
        done
    volumes:
      - ./backups:/backups:ro
      - wal_archive:/wal_archive:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [private]

  database-backup:
    image: postgres:16-alpine
    mem_limit: 128m
    cpus: 0.5
    profiles: ["backups"]
    env_file: .env.production
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ);
          pg_dump -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          --format=custom --no-owner --no-privileges
          --file="/backups/saydian-app-$${stamp}.dump" &&
          sha256sum "/backups/saydian-app-$${stamp}.dump"
          > "/backups/saydian-app-$${stamp}.dump.sha256";
          find /backups -maxdepth 1 -type f -mtime +30 -name 'saydian-app-*.dump*' -delete;
          sleep 86400;
        done
    volumes:
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [private]

networks:
  private:
    internal: false
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:-saidian_default}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  wal_archive:
  minio_data:
