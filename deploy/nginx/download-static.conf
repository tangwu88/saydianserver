server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=10s;
  set $api_upstream unified-api:8080;

  location = /down {
    try_files /down/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location = /down/ {
    try_files /down/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location = /say-ring {
    try_files /down/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location = /down2 {
    try_files /down/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location = /down2/ {
    try_files /down/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location = /say-ring/ {
    try_files /down/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location = /say-ring/privacy {
    proxy_pass http://$api_upstream/api/saydian-app/v2/content/legal-page/say-ring/privacy;
    proxy_set_header Host $host;
  }

  location = /say-ring/terms {
    proxy_pass http://$api_upstream/api/saydian-app/v2/content/legal-page/say-ring/terms;
    proxy_set_header Host $host;
  }

  location ^~ /down/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ^~ /down/files/ {
    types {
      application/vnd.android.package-archive apk;
      application/octet-stream hap;
    }

    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Disposition "attachment" always;
    limit_except GET HEAD {
      deny all;
    }
  }

  location /down/ {
    try_files $uri $uri/ /down/index.html;
    add_header Cache-Control "no-store" always;
  }
}
