# Include inside the TLS server for links.saydian.cn after a valid certificate
# and the Apple association are verified. The shared H5 passes tokens in the
# fragment. Only the app handoff pages and their required read route live here.
location = /.well-known/apple-app-site-association {
    proxy_pass http://global-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ~ ^/global/say-ring/(invite|respond)$ {
    access_log off;
    proxy_pass http://global-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /global/api/saydian-app/v2/ring/care/invitations/preview {
    access_log off;
    proxy_pass http://global-api:8080/api/saydian-app/v2/ring/care/invitations/preview;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-App-Realm "";
    proxy_set_header X-Realm "";
}
