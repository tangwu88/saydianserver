server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  location = /health/live {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /admin {
    return 308 /admin/;
  }

  location = /admin/index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location ^~ /admin/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-store" always;
  }

  location = /global/saidian-mall {
    return 308 /global/saidian-mall/;
  }

  # OAuth code/state must not enter access logs, caches or outbound Referer.
  location = /global/saidian-mall/oauth/callback {
    access_log off;
    try_files /global/saidian-mall/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~ ^/global/saidian-mall/(assets|static)/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /global/saidian-mall/index.html {
    access_log off;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location /global/saidian-mall/ {
    access_log off;
    try_files $uri $uri/ /global/saidian-mall/index.html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location / {
    return 404;
  }
}
