# Include inside the existing app.saydian.cn TLS server block, after approval.
# Static upstream identity: no request header, cookie or query can select a realm.
# The production /admin and /admin/ locations must proxy unchanged paths to
# http://global-admin:8080; this is the independent international admin frontend.
# Its browser API requests use /global/api/ below. Do not add an API proxy to the
# static admin container or change the existing /global/ routing for this switch.
location = /global/api {
    return 308 /global/api/;
}

location = /global/api/saydian-app/admin/v1/app-packages {
    client_max_body_size 130m;
    proxy_pass http://global-api:8080/api/saydian-app/admin/v1/app-packages;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-App-Realm "";
    proxy_set_header X-Realm "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location ^~ /global/api/ {
    proxy_pass http://global-api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-App-Realm "";
    proxy_set_header X-Realm "";
    proxy_read_timeout 60s;
}

location = /global/health {
    proxy_pass http://global-api:8080/health/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /global/health/ {
    proxy_pass http://global-api:8080/health/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# Independent H5 frontend. No domestic API or frontend fallback is permitted.
location = /global/saidian-mall {
    return 308 /global/saidian-mall/;
}

location ^~ /global/saidian-mall/ {
    access_log off;
    proxy_pass http://global-admin:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Referrer-Policy is supplied by the static upstream. Do not add_header
    # here: doing so would suppress inherited gateway security headers.
}

# Public SAYDIAN Health policy, support, and deletion-request pages. These
# remain in the international namespace and are served by the same static image.
location = /global/privacy-policy {
    proxy_pass http://global-admin:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /global/terms {
    proxy_pass http://global-admin:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /global/support {
    proxy_pass http://global-admin:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /global/account-deletion {
    proxy_pass http://global-admin:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /global/public-assets/ {
    proxy_pass http://global-admin:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /global/down/files/ {
    proxy_pass http://global-admin:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /global/down {
    proxy_pass http://global-admin:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /global/down/ {
    proxy_pass http://global-admin:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# Dedicated Say Ring application download page.
location = /say-ring {
    proxy_pass http://global-admin:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /say-ring/ {
    proxy_pass http://global-admin:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# Other global paths are not published by this scaffold. Never fall through to
# domestic /admin, /down, /saidian-mall or API routes.
location = /global {
    return 404;
}

location ^~ /global/ {
    return 404;
}
