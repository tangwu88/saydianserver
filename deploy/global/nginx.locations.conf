# Include inside the existing app.saydian.cn TLS server block, after approval.
# Static upstream identity: no request header, cookie or query can select a realm.
location = /global/api {
    return 308 /global/api/;
}

location ^~ /global/api/ {
    proxy_pass http://global-api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-App-Realm "";
    proxy_set_header X-Realm "";
    proxy_read_timeout 60s;
}

location = /global/health {
    proxy_pass http://global-api:8080/health/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /global/health/ {
    proxy_pass http://global-api:8080/health/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# Global frontend assets and localized content are not published by this scaffold.
# Never fall through to the domestic /admin, /down, /saidian-mall or API routes.
location = /global {
    return 404;
}

location ^~ /global/ {
    return 404;
}
