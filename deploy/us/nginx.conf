# Add a new US vhost; do not overwrite existing Baota/Postiz vhosts.
server {
    listen 80;
    server_name app.saydian.com;
    location ^~ /.well-known/acme-challenge/ { root /opt/saydian-us/acme; }
    location / { return 308 https://app.saydian.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name app.saydian.com;
    ssl_certificate /opt/saydian-us/private/tls/fullchain.pem;
    ssl_certificate_key /opt/saydian-us/private/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /global/api/ {
        rewrite ^/global(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18180;
        include /opt/saydian-us/nginx-proxy.conf;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18180;
        include /opt/saydian-us/nginx-proxy.conf;
    }
    location = /health/ready {
        proxy_pass http://127.0.0.1:18180;
        include /opt/saydian-us/nginx-proxy.conf;
    }
    location = /global/health/ready {
        rewrite ^ /health/ready break;
        proxy_pass http://127.0.0.1:18180;
        include /opt/saydian-us/nginx-proxy.conf;
    }
    location = / { return 302 /global/support; }
    location / {
        proxy_pass http://127.0.0.1:18181;
        include /opt/saydian-us/nginx-proxy.conf;
    }
}
