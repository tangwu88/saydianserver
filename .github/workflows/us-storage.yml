name: US storage images
on:
  push:
    branches: [main]
    paths: [deploy/us/storage.Dockerfile, .github/workflows/us-storage.yml, deploy/us/storage-smoke.sh]
  pull_request:
    paths: [deploy/us/storage.Dockerfile, .github/workflows/us-storage.yml, deploy/us/storage-smoke.sh]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: us-storage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-runtime-docker
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/us/storage.Dockerfile
          target: minio-runtime
          load: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/tangwu88/saydianserver-us-minio:sha-${{ github.sha }}
          cache-from: type=gha,scope=us-storage,version=2
          cache-to: type=gha,scope=us-storage,version=2,mode=max,ignore-error=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/us/storage.Dockerfile
          target: mc-runtime
          load: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/tangwu88/saydianserver-us-mc:sha-${{ github.sha }}
          cache-from: type=gha,scope=us-storage,version=2
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Validate actual private S3 images within US memory limits
        run: bash deploy/us/storage-smoke.sh "$GITHUB_SHA"
      - name: Publish verified immutable infrastructure manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for name in minio mc; do docker push "ghcr.io/tangwu88/saydianserver-us-$name:sha-$GITHUB_SHA"; done
          python3 - <<'PY'
          import json,os,subprocess
          revision=os.environ['GITHUB_SHA']
          sources={'minio':'72cff79c8a7cc59bccb591995e3c3ed6aa2f4cd5','mc':'2c94b8d03979ed96a6379ecabc3435b271398efc'}
          images={}
          for name,source in sources.items():
              repository='ghcr.io/tangwu88/saydianserver-us-'+name
              item=json.loads(subprocess.check_output(['docker','image','inspect',repository+':sha-'+revision]))[0]
              assert item['Config']['Labels']['org.opencontainers.image.revision']==revision
              ref=next(ref for ref in item['RepoDigests'] if ref.startswith(repository+'@sha256:'))
              assert ref.endswith('@'+item['Id'])
              images[name]={'ref':ref,'imageId':item['Id'],'sizeBytes':item['Size'],'sourceRevision':source}
          with open('us-storage-manifest.json','w') as file:json.dump({'schemaVersion':1,'revision':revision,'site':'us','images':images},file,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: us-storage-${{ github.sha }}
          path: us-storage-manifest.json
          retention-days: 90
          if-no-files-found: error
