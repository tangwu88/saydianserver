name: US fresh bootstrap rehearsal
on:
  pull_request:
    paths: ['deploy/us/**', '.github/workflows/us-bootstrap*.yml']
  push:
    branches: [main]
    paths: ['deploy/us/**', '.github/workflows/us-bootstrap*.yml']
permissions:
  contents: read
  packages: read
  actions: read
jobs:
  fresh-us:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-6522ab9808803ac652412a0ed810c8addb473101
          path: verified-release
          run-id: 38517270486
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: us-storage-6522ab9808803ac652412a0ed810c8addb473101
          path: verified-storage
          run-id: 38517270510
          github-token: ${{ github.token }}
      - name: Rehearse fresh US procedure with verified runtime images and actual PostgreSQL/S3
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/us/bootstrap-smoke.sh
