name: Release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image version, for example 2026.09.02-rc1
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [api, worker, admin, deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: version
        shell: bash
        run: |
          value="${{ inputs.version || github.ref_name }}"
          if [[ ! "$value" =~ ^[A-Za-z0-9._-]+$ ]]; then exit 1; fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: ghcr.io/tangwu88/saydianserver-${{ matrix.component }}:${{ steps.version.outputs.value }}
          provenance: true
          sbom: true
