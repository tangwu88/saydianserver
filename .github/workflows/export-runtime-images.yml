name: Export runtime images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image version to export
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export runtime images
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^[A-Za-z0-9._-]+$ ]]; then exit 1; fi

          images=(
            "ghcr.io/saydian88-cmyk/saydianapp-server-api:$version"
            "ghcr.io/saydian88-cmyk/saydianapp-server-worker:$version"
            "ghcr.io/saydian88-cmyk/saydianapp-server-admin:$version"
          )
          docker pull "${images[@]}"
          mkdir -p export
          archive="export/saydianapp-runtime-images-$version.tar.gz"
          docker save "${images[@]}" | gzip -9 > "$archive"
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-images-${{ inputs.version }}
          path: export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
