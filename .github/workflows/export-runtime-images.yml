name: Export runtime images

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact SHA of a previously verified main release
        required: true
        type: string
      build_run_id:
        description: Original successful CI verify run containing release manifest
        required: true
        type: string
      upload_to_server:
        description: Transfer and import these exact images through the existing receiver, without restarting applications
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    concurrency:
      group: ${{ inputs.upload_to_server && 'saydianapp-production' || format('saydian-export-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.revision }}
          path: export
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Export the original accepted artifacts without rebuilding
        env:
          REVISION: ${{ inputs.revision }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ && "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh run view "$BUILD_RUN_ID" --json headSha,event,jobs | jq -e --arg revision "$REVISION" '.headSha == $revision and .event == "push" and any(.jobs[]; .name == "verify" and .conclusion == "success")'
          node deploy/scripts/release-manifest.mjs verify "$REVISION" export/release-manifest.json
          images=()
          for component in api worker admin; do
            image=$(jq -r --arg component "$component" '.images[$component].ref' export/release-manifest.json)
            expected=$(jq -r --arg component "$component" '.images[$component].imageId' export/release-manifest.json)
            docker pull "$image"
            test "$(docker inspect -f '{{.Id}}' "$image")" = "$expected"
            images+=("$expected")
          done
          archive="export/saydianapp-runtime-images-$REVISION.tar.gz"
          docker save "${images[@]}" | gzip -1 > "$archive"
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-images-${{ inputs.revision }}
          path: export/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Transfer verified images without rebuilding or switching services
        if: inputs.upload_to_server
        env:
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deploy/scripts/send-offline-images.sh "$REVISION" export
