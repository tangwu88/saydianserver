name: saydianapp-local

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saydian_app}
      POSTGRES_USER: ${POSTGRES_USER:-saydian_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-saydian-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/saydian-app-private &&
        mc anonymous set none local/saydian-app-private
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-saydian-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: development
      PORT: 8080
      PUBLIC_BASE_URL: http://localhost:8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-saydian_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saydian_app}?schema=public
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      EMPLOYEE_TOKEN_SECRET: ${EMPLOYEE_TOKEN_SECRET:-}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER}
      INTEGRATION_MASTER_KEY: ${INTEGRATION_MASTER_KEY:-}
      WECHAT_LOGIN_APP_ID: ${WECHAT_LOGIN_APP_ID:-}
      WECHAT_LOGIN_APP_SECRET: ${WECHAT_LOGIN_APP_SECRET:-}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:-系统管理员}
      CORS_ORIGINS: http://localhost:3301,http://localhost:8080
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: saydian-app-private
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-saydian-local}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      SMS_PROVIDER: disabled
      PUSH_PROVIDER: ${PUSH_PROVIDER:-mock}
      AI_PROVIDER: disabled
      COMMERCE_MODE: integrated
      COMMERCE_STOREFRONT_URL: ${COMMERCE_STOREFRONT_URL:-http://localhost:3301/saidian-mall}
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_SECRET: ${WECOM_SECRET:-}
      WECOM_ALLOWED_REDIRECT_HOSTS: ${WECOM_ALLOWED_REDIRECT_HOSTS:-localhost}
      ENABLE_HEALTH_REPORT_SALES: ${ENABLE_HEALTH_REPORT_SALES:-false}
      HEALTH_REPORT_SINGLE_PRICE_CENTS: ${HEALTH_REPORT_SINGLE_PRICE_CENTS:-}
      HEALTH_MEMBERSHIP_30D_PRICE_CENTS: ${HEALTH_MEMBERSHIP_30D_PRICE_CENTS:-}
      APPLE_IAP_SINGLE_REPORT_PRODUCT_ID: ${APPLE_IAP_SINGLE_REPORT_PRODUCT_ID:-}
      APPLE_IAP_MEMBERSHIP_PRODUCT_ID: ${APPLE_IAP_MEMBERSHIP_PRODUCT_ID:-}
      APPLE_IAP_BUNDLE_ID: ${APPLE_IAP_BUNDLE_ID:-}
      APPLE_IAP_APP_APPLE_ID: ${APPLE_IAP_APP_APPLE_ID:-}
      APPLE_ROOT_CA_PATHS: ${APPLE_ROOT_CA_PATHS:-}
      APPLE_IAP_ENVIRONMENTS: ${APPLE_IAP_ENVIRONMENTS:-Sandbox}
      APPLE_IAP_ONLINE_CHECKS: ${APPLE_IAP_ONLINE_CHECKS:-true}
      WECHAT_PAY_MERCHANT_ID: ${WECHAT_PAY_MERCHANT_ID:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_PRIVATE_KEY_PEM: ${WECHAT_PAY_PRIVATE_KEY_PEM:-}
      WECHAT_PAY_PLATFORM_PUBLIC_KEY_PEM: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PEM:-}
      WECHAT_PAY_PLATFORM_SERIAL_NO: ${WECHAT_PAY_PLATFORM_SERIAL_NO:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_APP_ID_MINI: ${WECHAT_PAY_APP_ID_MINI:-}
      WECHAT_PAY_APP_ID_APP: ${WECHAT_PAY_APP_ID_APP:-}
      WECHAT_PAY_APP_ID_OFFICIAL: ${WECHAT_PAY_APP_ID_OFFICIAL:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY_PEM: ${ALIPAY_PRIVATE_KEY_PEM:-}
      ALIPAY_PUBLIC_KEY_PEM: ${ALIPAY_PUBLIC_KEY_PEM:-}
      ALLOW_TEST_OTP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-saydian_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saydian_app}?schema=public
      REDIS_URL: redis://redis:6379
      INTEGRATION_MASTER_KEY: ${INTEGRATION_MASTER_KEY:-}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-mock}
      JPUSH_APP_KEY: ${JPUSH_APP_KEY:-}
      JPUSH_MASTER_SECRET: ${JPUSH_MASTER_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      JUSHUITAN_APP_KEY: ${JUSHUITAN_APP_KEY:-}
      JUSHUITAN_APP_SECRET: ${JUSHUITAN_APP_SECRET:-}
      JUSHUITAN_ACCESS_TOKEN: ${JUSHUITAN_ACCESS_TOKEN:-}
      JUSHUITAN_SHOP_ID: ${JUSHUITAN_SHOP_ID:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3301:8080"
    volumes:
      - ./deploy/downloads:/usr/share/nginx/html/down/files:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
